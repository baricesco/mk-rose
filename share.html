<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Billing History — MK ROSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="css/style.css"/>
<style>
  /* This page is always light theme, regardless of what the owner's app is set to. */
  .share-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 1.5rem;border-bottom:1px solid var(--border);background:var(--surface)}
  .share-topbar .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.02em}
  .share-topbar .logo-mark{width:28px;height:28px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center}
  .share-topbar .logo-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
  .share-foot{text-align:center;font-size:11px;color:var(--text3);padding:24px 1.5rem 32px}
</style>
</head>
<body>

<div class="share-topbar">
  <div class="logo">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    MK ROSE
  </div>
  <div style="font-size:11.5px;color:var(--text3)">Shared billing history — read only</div>
</div>

<div class="page active" id="share-root" style="max-width:1000px">
  <div class="empty-state" style="padding:60px 20px">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    <p>Loading…</p>
  </div>
</div>

<div class="share-foot">This is a read-only view generated by MK ROSE. Amounts and photos reflect the owner's records.</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- PDF Generation Progress -->
<div class="overlay" id="modal-pdf-progress">
  <div class="modal" style="max-width:420px">
    <div class="modal-hdr">
      <div class="modal-title" id="pdf-progress-title">Generating PDF…</div>
    </div>
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--text2);margin-bottom:12px;min-height:18px" id="pdf-progress-status">Preparing…</div>
      <div style="background:var(--surface2);border-radius:99px;height:8px;overflow:hidden">
        <div id="pdf-progress-bar" style="height:100%;width:0%;background:var(--green);transition:width .25s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px">
        <small style="font-size:11px;color:var(--text3)">Please keep this tab open</small>
        <span style="font-size:11px;color:var(--text3);white-space:nowrap;margin-left:8px" id="pdf-progress-count"></span>
      </div>
    </div>
  </div>
</div>

<!-- Meter Photos — Lightbox -->
<div class="overlay lightbox-overlay" id="modal-lightbox">
  <button class="lightbox-close" aria-label="Close" onclick="closeModal('modal-lightbox')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  <button class="lightbox-nav lightbox-prev" aria-label="Previous photo" onclick="shareLightboxStep(-1)"><svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
  <div class="lightbox-content">
    <img id="lightbox-img" alt="meter photo"/>
    <div class="lightbox-caption">
      <div id="lightbox-title" style="font-weight:600"></div>
      <div id="lightbox-sub" style="color:var(--text3);font-size:11.5px;margin-top:2px"></div>
    </div>
    <div class="lightbox-actions">
      <button class="btn btn-ghost btn-sm" id="lightbox-dl-btn" onclick="downloadCurrentShareLightboxPhoto(this)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download
      </button>
    </div>
  </div>
  <button class="lightbox-nav lightbox-next" aria-label="Next photo" onclick="shareLightboxStep(1)"><svg viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg></button>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/print.js"></script>
<script src="js/share.js"></script>
</body>
</html>
